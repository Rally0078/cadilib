name: Publish to PyPI

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.os == 'ubuntu-latest' && 'quay.io/pypa/manylinux_2_28_x86_64' || '' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run cargo tests
        run: cargo test --manifest-path "./rust/Cargo.toml"

      - name: Build wheel with uv
        run: uv build --wheel --python ${{ matrix.python-version }}
      
      - name: Run tests with pytest
        run: uv run pytest -vv

      - name: Repair Linux wheels with auditwheel
        if: runner.os == 'Linux'
        run: |
          uv pip install auditwheel
          for whl in dist/*-linux_x86_64.whl; do
            if [ -f "$whl" ]; then
              uv run auditwheel repair "$whl" -w dist/
              rm "$whl" # Remove unrepaired wheel so PyPI isn't presented with linux_x86_64
            fi
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  publish-to-pypi:
    name: Publish binary wheels to PyPI
    needs: [build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cadilib
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
