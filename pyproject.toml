[build-system]
requires = ["hatchling", "cython>=3.0", "setuptools>=70", "numpy"]
build-backend = "hatchling.build"

[project]
name = "cadilib"
version = "0.1.1"
description = "CADI MDx binary and SAMEER ionogram data parsing and analysis library"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Jaideep Vimal Jothi S" },
]
keywords = [
    "cadi",
    "ionosonde",
    "ionogram",
    "sameer",
    "space-physics",
    "geophysics",
    "radar",
    "scientific-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "scipy",
    "scikit-image",
    "platformdirs"
]

[project.optional-dependencies]
pyarrow = [
    "pyarrow"
]

[project.urls]
Homepage = "https://github.com/Rally0078/cadilib"
Repository = "https://github.com/Rally0078/cadilib"
Issues = "https://github.com/Rally0078/cadilib/issues"

[dependency-groups]
dev = [
    "pytest",
    "pyarrow",
    "cython",
    "mypy",
    "setuptools",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cadilib"]
exclude = [
    "*.py",
    "!__init__.py",
    "*.c",
]
artifacts = [
    "src/cadilib/**/*.pyd",
    "stubs/cadilib/**/*.pyi",
    "src/cadilib/**/*.so",
]

[tool.hatch.build.targets.wheel.force-include]
"stubs/cadilib" = "cadilib"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv]
managed = true
